name: Scala CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    steps:
    - uses: actions/checkout@v7
    - name: Start RabbitMQ
      uses: namoshek/rabbitmq-github-action@v1
      with:
        version: '3.12.1'
        ports: '5672:5672'
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt +test

  publish-snapshot:
    name: Publish snapshot
    needs: test
    if: github.repository == 'pjfanning/op-rabbit' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Import PGP key
      env:
        PGP_SECRET: ${{ secrets.PGP_SECRET }}
      run: |
        if printf '%s' "$PGP_SECRET" | grep -q -- '-----BEGIN PGP'; then
          printf '%s\n' "$PGP_SECRET" | gpg --batch --import
        else
          printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --import
        fi
    - name: Publish snapshot
      env:
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      run: sbt +publishSigned
